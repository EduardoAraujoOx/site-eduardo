name: Cenário integral auditoria PR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/build-pr-full-audit-sensitivity.py"
      - ".github/workflows/build-pr-full-audit-sensitivity.yml"

permissions:
  contents: write

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Calcular cenário auditado
        run: python3 data/build-pr-full-audit-sensitivity.py
      - name: Salvar resultados sem apagar arquivos existentes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/audit-output
          cp data/auditoria-pr-validacao/*auditoria-integral* /tmp/audit-output/
          cp data/auditoria-pr-validacao/resumo-pr-auditoria-integral-* /tmp/audit-output/
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/auditoria-pr-validacao
          cp /tmp/audit-output/* data/auditoria-pr-validacao/
          git add data/auditoria-pr-validacao/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "dados: cenário integral de auditoria municipal PR"
          git push origin HEAD:main
