name: Gerar mapa municipal PR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/build-map-pr-variacoes.py"
      - ".github/workflows/build-map-pr.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas matplotlib geopandas requests
      - run: python data/build-map-pr-variacoes.py
      - uses: actions/upload-artifact@v4
        with:
          name: mapa-municipal-pr
          path: |
            artifacts/mapa_variacao_municipal_pr_2033.pdf
            artifacts/mapa_variacao_municipal_pr_2033.png
          retention-days: 7
      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/mapa_variacao_municipal_pr_2033.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "artigo: mapa municipal PR 2033"
          git push
