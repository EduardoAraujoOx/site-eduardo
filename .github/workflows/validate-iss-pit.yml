name: Validar ISS no PIT TCE-PR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/validate-iss-pit.py"
      - ".github/workflows/validate-iss-pit.yml"

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências
        run: pip install beautifulsoup4
      - name: Validar ISS no PIT
        run: python3 data/validate-iss-pit.py
      - name: Salvar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -R data/auditoria-pr-validacao /tmp/auditoria-pr-validacao
          git fetch origin main
          git reset --hard origin/main
          rm -rf data/auditoria-pr-validacao
          cp -R /tmp/auditoria-pr-validacao data/auditoria-pr-validacao
          git add data/auditoria-pr-validacao/
          if git diff --staged --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "dados: validação dirigida do ISS no PIT TCE-PR"
          git push origin HEAD:main
