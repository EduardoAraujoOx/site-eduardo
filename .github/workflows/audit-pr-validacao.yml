name: Validação Paraná - DCA x Portal PR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/audit-pr-validacao.py"
      - "data/reconstruct-pr-cota-portal.py"
      - ".github/workflows/audit-pr-validacao.yml"

permissions:
  contents: write

concurrency:
  group: audit-pr-validacao
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências
        run: pip install beautifulsoup4

      - name: Validar dados do Paraná
        run: python3 data/audit-pr-validacao.py

      - name: Reconstruir CPT municipal com repasses estaduais
        run: python3 data/reconstruct-pr-cota-portal.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-pr-validacao
          path: data/auditoria-pr-validacao/
          retention-days: 30

      - name: Salvar diagnóstico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auditoria-pr-validacao/
          if git diff --staged --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "dados: validação DCA x Portal PR e auditoria estadual"
          git pull --rebase origin main
          git push origin HEAD:main
